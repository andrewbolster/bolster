repos:
    - repo: https://github.com/executablebooks/mdformat
      rev: 0.7.13 # Use the ref you want to point at
      hooks:
          - id: mdformat
            additional_dependencies:
                - mdformat-ruff
            exclude: ^\.claude/
    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version — kept in exact sync with the ruff dev dependency in
      # pyproject.toml, so `uv run ruff`, this hook, and CI's
      # `pre-commit run --all-files` are provably the same binary.
      rev: v0.16.5
      hooks:
          # Run the linter.
          - id: ruff
            types_or: [python, pyi]
            args: [--fix]
            files: ^(src|tests)/.*\.py$
          # Run the formatter.
          - id: ruff-format
            types_or: [python, pyi]
            files: ^(src|tests)/.*\.py$
    # mypy is deliberately NOT a pre-commit hook here — 341 pre-existing
    # errors across 50 files on first run, mostly BeautifulSoup's loose
    # typing in the health_ni/nisra scrapers, would block every local commit
    # until that backlog is cleared. It runs as its own job in lint.yml
    # instead: a real, visible, separately-failing merge status check
    # without gating commits on a debt this change didn't create.
    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
          - id: gitleaks
    - repo: local
      hooks:
          - id: actionlint
            name: Lint GitHub Actions workflow files
            language: python
            entry: actionlint
            additional_dependencies: ["actionlint-py==1.7.12.24"]
            types: [yaml]
            files: ^\.github/workflows/
            pass_filenames: false

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      # check-added-large-files stays out deliberately — notebooks routinely
      # exceed the default size threshold and there's no clean way to
      # exclude just their output cells.
      hooks:
          - id: check-toml
          - id: end-of-file-fixer
          - id: check-merge-conflict
            exclude: ^.*\.rst$
          - id: check-byte-order-marker # Forbid UTF-8 byte-order markers
          # Check for files with names that would conflict on a case-insensitive
          # filesystem like MacOS HFS+ or Windows FAT.
          - id: check-case-conflict
          - id: check-json
          - id: check-yaml
          - id: trailing-whitespace
          - id: mixed-line-ending
          - id: detect-private-key

    # Constitutional compliance checks (critical patterns only)
    # Logging standards now enforced by ruff LOG rules (LOG001, LOG002, LOG015)
    # - LOG001: Prevents direct logging.Logger() instantiation
    # - LOG002: Requires logging.getLogger(__name__) pattern
    # - LOG015: Prevents root logger usage (logging.info/warning/etc)
    # This is better than string matching as it uses proper AST analysis
    - repo: local
      hooks:
# Constitutional validation function requirement removed - these were mostly
          # overkill sanity checks that don't add real value. Keep sophisticated
          # cross-validation examples in examples/ directory for meaningful data quality checks.

          - id: import-linter-check
            name: Check architectural import constraints
            entry: bash
            language: system
            args:
                - -c
                - PYTHONPATH=src uv run lint-imports
            pass_filenames: false
            types: [python]
            # Only run on Python files in src/ to match other checks
            files: ^src/.*\.py$

