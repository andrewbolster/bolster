name: Scorecard supply-chain security

on:
    branch_protection_rule:
    schedule:
        - cron: "30 1 * * 6"  # Weekly on Saturday
    push:
        branches: ["main"]

permissions: read-all

jobs:
    analysis:
        name: Scorecard analysis
        runs-on: ubuntu-latest
        # Code-Review check is structurally 0 for a solo project (no second approver).
        # The SARIF results still upload to GitHub Security; this stops that from
        # failing the whole workflow and blocking main CI.
        continue-on-error: true
        permissions:
            security-events: write
            id-token: write
            contents: read
            actions: read

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  persist-credentials: false

            - name: Run Scorecard analysis
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
              with:
                  results_file: results.sarif
                  results_format: sarif
                  publish_results: true

            - name: Upload SARIF artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
              with:
                  name: SARIF file
                  path: results.sarif
                  retention-days: 5

            - name: Upload to GitHub code-scanning
              uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46  # codeql-bundle-v2.26.0
              with:
                  sarif_file: results.sarif
