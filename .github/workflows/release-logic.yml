name: Release Logic (Reusable)
# Shared conventional-commit release workflow. Called by auto-release.yml in
# this repo and by andrewbolster/mcp.bolster.online via workflow_call.
#
# Inputs
# ------
# version_bump   : override bump type ('auto' means analyse commits)
# block_minor    : when true, a detected breaking change requires manual
#                  workflow_dispatch instead of auto-releasing. Below 1.0.0,
#                  the minor position (0.X.y) is what block_minor guards —
#                  feat: commits bump patch automatically, since a new
#                  non-breaking feature isn't the kind of event a 0.x
#                  package needs a human to sign off on; only an actual
#                  BREAKING CHANGE/`!:` commit does.
# package_name   : PyPI package name (used in PR body installation snippet)
# docs_url       : documentation URL (omitted from PR body when blank)
# pypi_base_url  : PyPI package base URL, e.g. https://pypi.org/project/bolster
#                  (omitted from PR body when blank)
#
# Jobs
# ----
# analyze-changes : inspects commits since last tag, resolves bump type
# open-release-pr : bumps version, inserts changelog entry, opens PR

on:
    workflow_call:
        inputs:
            version_bump:
                description: "Version bump override (auto, patch, minor, major)"
                default: "auto"
                type: string
            block_minor:
                description: "Block automatic minor bumps; require workflow_dispatch"
                default: true
                type: boolean
            package_name:
                description: "PyPI package name for PR body installation snippet"
                required: true
                type: string
            docs_url:
                description: "Documentation URL for PR body (leave blank to omit)"
                default: ""
                type: string
            pypi_base_url:
                description: "PyPI base URL, e.g. https://pypi.org/project/bolster (leave blank to omit)"
                default: ""
                type: string

permissions:
    contents: write
    pull-requests: write

jobs:
    analyze-changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            should_release: ${{ steps.analyze.outputs.should_release }}
            version_bump: ${{ steps.analyze.outputs.version_bump }}
            changelog: ${{ steps.analyze.outputs.changelog }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  fetch-depth: 0

            - name: Analyze changes and determine version bump
              id: analyze
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
              with:
                  script: |
                      const { execSync } = require('child_process');

                      // Not `git describe --tags` — that requires the tag to be an ancestor
                      // of HEAD, which a squash-merged release PR breaks on the very next
                      // release: the tag lives on the (now-orphaned) release branch tip, not
                      // on the new squash commit main gets. That's not hypothetical — it's
                      // what actually crashed here (`fatal: ambiguous argument 'v0.0.0..HEAD'`)
                      // once the old fallback's fabricated tag didn't exist either. Highest
                      // version tag by name doesn't care about ancestry, and still returns ""
                      // (not an error) when the repo has no tags at all.
                      let lastTag = execSync("git tag --list 'v*' --sort=-v:refname | head -1", { encoding: 'utf-8' }).trim() || null;
                      console.log(`Last tag: ${lastTag || '(none — initial release)'}`);

                      const gitLogCmd = lastTag
                        ? `git log ${lastTag}..HEAD --pretty=format:"%s"`
                        : `git log HEAD --pretty=format:"%s"`;
                      const commits = execSync(gitLogCmd, { encoding: 'utf-8' })
                        .split('\n')
                        .filter(line => line.trim());
                      console.log(`Commits since ${lastTag || 'beginning'}:`, commits);

                      const skipPatterns = [
                        /^docs?(\(.*\))?:/,
                        /^ci(\(.*\))?:/,
                        /^chore(\(.*\))?:/,
                        /^style(\(.*\))?:/,
                        /^test(\(.*\))?:/,
                        /Merge pull request/,
                        /Update.*dependabot/i
                      ];
                      const releaseCommits = commits.filter(c => !skipPatterns.some(p => p.test(c)));

                      // Manual override: caller passes the workflow_dispatch input through
                      const versionBumpInput = '${{ inputs.version_bump }}';
                      if (versionBumpInput && versionBumpInput !== 'auto') {
                        core.setOutput('should_release', 'true');
                        core.setOutput('version_bump', versionBumpInput);
                        core.setOutput('changelog', 'Manual release triggered');
                        return;
                      }

                      // PR label override (version:skip / version:patch / etc.)
                      let labelOverride = null;
                      try {
                        const headSha = execSync('git rev-parse HEAD', { encoding: 'utf-8' }).trim();
                        const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          commit_sha: headSha,
                        });
                        for (const pr of prs.data) {
                          const vLabel = pr.labels.map(l => l.name).find(n => n.startsWith('version:'));
                          if (vLabel) {
                            labelOverride = vLabel.replace('version:', '');
                            console.log(`PR #${pr.number} label override: ${labelOverride}`);
                            break;
                          }
                        }
                      } catch (e) {
                        console.log(`Could not check PR labels: ${e.message}`);
                      }

                      if (labelOverride === 'skip') {
                        console.log('PR label version:skip — skipping release');
                        core.setOutput('should_release', 'false');
                        return;
                      }

                      if (releaseCommits.length === 0 && !labelOverride) {
                        console.log('No release-worthy changes found');
                        core.setOutput('should_release', 'false');
                        return;
                      }

                      // Below 1.0.0 the minor position is the one that
                      // signals a real compatibility break — feat: commits
                      // are new, non-breaking functionality and bump patch
                      // like everything else. Only an explicit BREAKING
                      // CHANGE/`!:` marker bumps minor. major is never
                      // auto-detected from commit messages at all — it's
                      // only reachable via an explicit workflow_dispatch
                      // (the versionBumpInput branch above), since declaring
                      // 1.0.0 is a decision only a human makes.
                      let versionBump = labelOverride || 'patch';
                      if (!labelOverride) {
                        let hasBreaking = false;
                        for (const commit of releaseCommits) {
                          if (commit.includes('BREAKING CHANGE') || commit.includes('!:')) { hasBreaking = true; break; }
                        }
                        if (hasBreaking) versionBump = 'minor';
                      }

                      // Gate: a detected breaking change requires manual dispatch when block_minor=true
                      const blockMinor = '${{ inputs.block_minor }}' === 'true';
                      if (versionBump === 'minor' && blockMinor) {
                        console.log(`${versionBump} bump detected (breaking change) — requires manual workflow_dispatch`);
                        core.setOutput('should_release', 'false');
                        return;
                      }

                      const changelog = releaseCommits.map(c => `- ${c}`).join('\n');
                      core.setOutput('should_release', 'true');
                      core.setOutput('version_bump', versionBump);
                      core.setOutput('changelog', changelog);
                      console.log(`Release decision: ${versionBump}`);

    open-release-pr:
        needs: analyze-changes
        if: needs.analyze-changes.outputs.should_release == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            # BOLSTER_TOKEN, not GITHUB_TOKEN: the branch+tag push later in this
            # job uses whatever credential this checkout configures. A
            # GITHUB_TOKEN-authored push doesn't trigger downstream workflows
            # (same reason the PR-merge step needs BOLSTER_TOKEN) — confirmed
            # live, the tag for v0.7.1 never triggered publish.yml until it was
            # manually re-pushed from a real account. `gh pr create` below still
            # runs under its own GH_TOKEN: GITHUB_TOKEN env, unaffected by this,
            # so the PR itself still shows as authored by github-actions[bot].
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  fetch-depth: 0
                  token: ${{ secrets.BOLSTER_TOKEN }}

            - name: Setup Python and uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: uv sync --dev

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Bump version
              run: |
                  uv run bump-my-version bump "${{ needs.analyze-changes.outputs.version_bump }}"
                  NEW_VERSION=$(uv run bump-my-version show current_version)
                  echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

            - name: Generate changelog entry
              env:
                  CHANGELOG_ENTRY: ${{ needs.analyze-changes.outputs.changelog }}
              run: |
                  python3 - <<'PYEOF'
                  import os
                  from datetime import date
                  from pathlib import Path

                  version = os.environ["NEW_VERSION"]
                  entry_text = os.environ["CHANGELOG_ENTRY"]
                  entry = f"\n## [{version}] - {date.today()}\n\n{entry_text}\n"

                  path = Path("CHANGELOG.md")
                  content = path.read_text()
                  lines = content.split("\n")
                  for i, line in enumerate(lines):
                      if line.startswith("# "):
                          lines.insert(i + 1, entry)
                          break
                  path.write_text("\n".join(lines))
                  PYEOF

            - name: Push version bump branch, tag, and open PR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CHANGELOG_ENTRY: ${{ needs.analyze-changes.outputs.changelog }}
                  PACKAGE_NAME: ${{ inputs.package_name }}
                  DOCS_URL: ${{ inputs.docs_url }}
                  PYPI_BASE_URL: ${{ inputs.pypi_base_url }}
                  VERSION_BUMP: ${{ needs.analyze-changes.outputs.version_bump }}
                  BOLSTER_TOKEN: ${{ secrets.BOLSTER_TOKEN }}
              run: |
                  BRANCH="release/v${NEW_VERSION}"

                  # PRs opened with GITHUB_TOKEN never fire pull_request_target (GitHub
                  # suppresses it to prevent loops), so automerge.yml — which is built to
                  # approve+merge exactly this kind of bot PR — can never see them; every
                  # release PR to date has needed a manual merge regardless of bump size.
                  # Patch bumps are already unattended in every other respect (auto-detected,
                  # no block_minor gate), so enable auto-merge directly here with a token
                  # that isn't GITHUB_TOKEN, instead of relying on a trigger that can't fire.
                  # Minor/major bumps only reach this step via an explicit human
                  # workflow_dispatch, so they're left for manual review and merge.
                  enable_automerge() {
                    if [ "$VERSION_BUMP" = "patch" ]; then
                      echo "Patch release — enabling auto-merge for $1"
                      GH_TOKEN="$BOLSTER_TOKEN" gh pr merge --auto --squash "$1"
                    fi
                  }

                  # Idempotency: tag already pushed in a previous run
                  if git ls-remote --exit-code origin "refs/tags/v${NEW_VERSION}" 2>/dev/null; then
                    echo "Tag v${NEW_VERSION} already exists — checking for open PR"
                    EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' 2>/dev/null || true)
                    if [ -n "$EXISTING_PR" ]; then
                      echo "PR #${EXISTING_PR} already open — nothing to do"
                      enable_automerge "$EXISTING_PR"
                      exit 0
                    fi
                    gh pr create \
                      --title "chore: bump version to ${NEW_VERSION}" \
                      --body "Automated version bump to ${NEW_VERSION} (retry — tag was already pushed in a previous run)." \
                      --label "version:skip" \
                      --base main \
                      --head "$BRANCH"
                    enable_automerge "$BRANCH"
                    exit 0
                  fi

                  git checkout -b "$BRANCH"
                  git add .
                  git commit -m "chore: bump version to ${NEW_VERSION}"
                  git tag "v${NEW_VERSION}"
                  git push origin "$BRANCH"
                  git push origin "v${NEW_VERSION}"

                  # Build optional PR body sections
                  INSTALL_SECTION=""
                  if [ -n "$PACKAGE_NAME" ]; then
                    INSTALL_SECTION="## Installation\n\n\`\`\`bash\npip install ${PACKAGE_NAME}==${NEW_VERSION}\n\`\`\`\n\n"
                  fi
                  DOCS_SECTION=""
                  if [ -n "$DOCS_URL" ] || [ -n "$PYPI_BASE_URL" ]; then
                    DOCS_SECTION="## Documentation\n\n"
                    [ -n "$DOCS_URL" ]      && DOCS_SECTION="${DOCS_SECTION}- [Documentation](${DOCS_URL})\n"
                    [ -n "$PYPI_BASE_URL" ] && DOCS_SECTION="${DOCS_SECTION}- [PyPI Package](${PYPI_BASE_URL}/${NEW_VERSION}/)\n"
                    DOCS_SECTION="${DOCS_SECTION}\n"
                  fi

                  printf "Automated version bump to %s.\n\n## Changes in this release\n\n%s\n\n%s%s---\n*This PR was automatically created by the release workflow.*\n" \
                    "${NEW_VERSION}" "${CHANGELOG_ENTRY}" "${INSTALL_SECTION}" "${DOCS_SECTION}" \
                    > /tmp/pr-body.md

                  gh pr create \
                    --title "chore: bump version to ${NEW_VERSION}" \
                    --body-file /tmp/pr-body.md \
                    --label "version:skip" \
                    --base main \
                    --head "$BRANCH"
                  enable_automerge "$BRANCH"
