name: Release Logic (Reusable)
# Shared conventional-commit release workflow. Called by auto-release.yml in
# this repo and by andrewbolster/mcp.bolster.online via workflow_call.
#
# Inputs
# ------
# version_bump   : override bump type ('auto' means analyse commits)
# block_major    : when true, a detected breaking change requires manual
#                  workflow_dispatch instead of auto-releasing. Standard
#                  semver mapping: fix:/other -> patch, feat: -> minor,
#                  both auto-released and auto-merged unattended; only an
#                  actual BREAKING CHANGE/`!:` commit bumps major, and
#                  major is a deliberate human decision even when detected
#                  (a bigger piece of work than an auto-release should ship
#                  on its own), gated by this flag.
# package_name   : PyPI package name (used in PR body installation snippet)
# docs_url       : documentation URL (omitted from PR body when blank)
# pypi_base_url  : PyPI package base URL, e.g. https://pypi.org/project/bolster
#                  (omitted from PR body when blank)
#
# Jobs
# ----
# analyze-changes : inspects commits since last tag, resolves bump type
# open-release-pr : bumps version, inserts changelog entry, opens PR

on:
    workflow_call:
        inputs:
            version_bump:
                description: "Version bump override (auto, patch, minor, major)"
                default: "auto"
                type: string
            block_major:
                description: "Block automatic major bumps; require workflow_dispatch"
                default: true
                type: boolean
            package_name:
                description: "PyPI package name for PR body installation snippet"
                required: true
                type: string
            docs_url:
                description: "Documentation URL for PR body (leave blank to omit)"
                default: ""
                type: string
            pypi_base_url:
                description: "PyPI base URL, e.g. https://pypi.org/project/bolster (leave blank to omit)"
                default: ""
                type: string

permissions:
    contents: write
    pull-requests: write

jobs:
    analyze-changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            should_release: ${{ steps.analyze.outputs.should_release }}
            version_bump: ${{ steps.analyze.outputs.version_bump }}
            changelog: ${{ steps.analyze.outputs.changelog }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  fetch-depth: 0

            - name: Analyze changes and determine version bump
              id: analyze
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
              with:
                  script: |
                      const { execSync } = require('child_process');

                      // Not `git describe --tags` — that requires the tag to be an ancestor
                      // of HEAD, which a squash-merged release PR breaks on the very next
                      // release: the tag lives on the (now-orphaned) release branch tip, not
                      // on the new squash commit main gets. That's not hypothetical — it's
                      // what actually crashed here (`fatal: ambiguous argument 'v0.0.0..HEAD'`)
                      // once the old fallback's fabricated tag didn't exist either. Highest
                      // version tag by name doesn't care about ancestry, and still returns ""
                      // (not an error) when the repo has no tags at all.
                      let lastTag = execSync("git tag --list 'v*' --sort=-v:refname | head -1", { encoding: 'utf-8' }).trim() || null;
                      console.log(`Last tag: ${lastTag || '(none — initial release)'}`);

                      const gitLogCmd = lastTag
                        ? `git log ${lastTag}..HEAD --pretty=format:"%s"`
                        : `git log HEAD --pretty=format:"%s"`;
                      const commits = execSync(gitLogCmd, { encoding: 'utf-8' })
                        .split('\n')
                        .filter(line => line.trim());
                      console.log(`Commits since ${lastTag || 'beginning'}:`, commits);

                      // Separate query for breaking-change detection: %s above is
                      // subject-only (deliberately, so the changelog stays one line
                      // per commit) and can never contain a `BREAKING CHANGE:`
                      // footer, which lives in the body. %B (raw body, subject
                      // included) with a null-byte delimiter recovers the full text
                      // per commit without disturbing the changelog's own parsing.
                      const gitBodyCmd = lastTag
                        ? `git log ${lastTag}..HEAD --pretty=format:"%B%x00"`
                        : `git log HEAD --pretty=format:"%B%x00"`;
                      const commitBodies = execSync(gitBodyCmd, { encoding: 'utf-8' })
                        .split('\0')
                        .map(body => body.trim())
                        .filter(body => body.length > 0);
                      const hasBreakingChange = commitBodies.some(
                        body => /^[a-z]+(\(.*\))?!:/.test(body) || /^BREAKING CHANGE:/m.test(body)
                      );
                      if (hasBreakingChange) console.log('Breaking change detected (subject `!:` or body `BREAKING CHANGE:` footer)');

                      const skipPatterns = [
                        /^docs?(\(.*\))?:/,
                        /^ci(\(.*\))?:/,
                        /^chore(\(.*\))?:/,
                        /^style(\(.*\))?:/,
                        /^test(\(.*\))?:/,
                        /Merge pull request/,
                        /Update.*dependabot/i
                      ];
                      const releaseCommits = commits.filter(c => !skipPatterns.some(p => p.test(c)));
                      const hasFeature = releaseCommits.some(c => /^feat(\(.*\))?!?:/.test(c));

                      // Manual override: caller passes the workflow_dispatch input through
                      const versionBumpInput = '${{ inputs.version_bump }}';
                      if (versionBumpInput && versionBumpInput !== 'auto') {
                        core.setOutput('should_release', 'true');
                        core.setOutput('version_bump', versionBumpInput);
                        core.setOutput('changelog', 'Manual release triggered');
                        return;
                      }

                      // PR label override (version:skip / version:patch / etc.)
                      let labelOverride = null;
                      try {
                        const headSha = execSync('git rev-parse HEAD', { encoding: 'utf-8' }).trim();
                        const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          commit_sha: headSha,
                        });
                        for (const pr of prs.data) {
                          const vLabel = pr.labels.map(l => l.name).find(n => n.startsWith('version:'));
                          if (vLabel) {
                            labelOverride = vLabel.replace('version:', '');
                            console.log(`PR #${pr.number} label override: ${labelOverride}`);
                            break;
                          }
                        }
                      } catch (e) {
                        console.log(`Could not check PR labels: ${e.message}`);
                      }

                      if (labelOverride === 'skip') {
                        console.log('PR label version:skip — skipping release');
                        core.setOutput('should_release', 'false');
                        return;
                      }

                      if (releaseCommits.length === 0 && !labelOverride) {
                        console.log('No release-worthy changes found');
                        core.setOutput('should_release', 'false');
                        return;
                      }

                      // Standard semver mapping: fix:/other -> patch,
                      // feat: -> minor, a breaking change -> major. A label
                      // on the merged PR overrides commit-message detection
                      // for patch/minor/major alike — including 'major',
                      // which then hits the same gate below as an
                      // auto-detected breaking change would.
                      let versionBump = labelOverride || 'patch';
                      if (!labelOverride) {
                        if (hasBreakingChange) versionBump = 'major';
                        else if (hasFeature) versionBump = 'minor';
                      }

                      // Gate: major never auto-releases when block_major=true —
                      // it's a deliberate decision, larger than an unattended
                      // release should ship on its own, made via an explicit
                      // workflow_dispatch (the versionBumpInput branch above).
                      const blockMajor = '${{ inputs.block_major }}' === 'true';
                      if (versionBump === 'major' && blockMajor) {
                        console.log(`${versionBump} bump detected (breaking change) — requires manual workflow_dispatch`);
                        core.setOutput('should_release', 'false');
                        return;
                      }

                      const changelog = releaseCommits.map(c => `- ${c}`).join('\n');
                      core.setOutput('should_release', 'true');
                      core.setOutput('version_bump', versionBump);
                      core.setOutput('changelog', changelog);
                      console.log(`Release decision: ${versionBump}`);

    open-release-pr:
        needs: analyze-changes
        if: needs.analyze-changes.outputs.should_release == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            # BOLSTER_TOKEN, not GITHUB_TOKEN: the branch+tag push later in this
            # job uses whatever credential this checkout configures. A
            # GITHUB_TOKEN-authored push doesn't trigger downstream workflows
            # (same reason the PR-merge step needs BOLSTER_TOKEN) — confirmed
            # live, the tag for v0.7.1 never triggered publish.yml until it was
            # manually re-pushed from a real account. `gh pr create` below is
            # explicitly run with BOLSTER_TOKEN too — a PR authored by the
            # github-actions[bot] App identity (the default GH_TOKEN) gets its
            # pull_request-triggered checks stuck in "action_required" pending
            # manual approval even on a same-repo, non-fork branch (confirmed
            # live: v0.8.1's bump PR #2144 sat blocked for days because of
            # this, silently defeating unattended auto-merge).
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  fetch-depth: 0
                  token: ${{ secrets.BOLSTER_TOKEN }}

            - name: Setup Python and uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: uv sync --dev

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Bump version
              run: |
                  uv run bump-my-version bump "${{ needs.analyze-changes.outputs.version_bump }}"
                  NEW_VERSION=$(uv run bump-my-version show current_version)
                  echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

            - name: Generate changelog entry
              env:
                  CHANGELOG_ENTRY: ${{ needs.analyze-changes.outputs.changelog }}
              run: |
                  python3 - <<'PYEOF'
                  import os
                  import re
                  from datetime import date
                  from pathlib import Path

                  version = os.environ["NEW_VERSION"]
                  entry_text = os.environ["CHANGELOG_ENTRY"]
                  # Brackets escaped (\[...\]) so mdformat — which treats an
                  # unescaped [label] at the start of a line as a possible
                  # link reference — doesn't rewrite this on the next
                  # `pre-commit run --all-files`, which some callers of this
                  # reusable workflow run as their CI gate.
                  entry = f"\n## \\[{version}\\] - {date.today()}\n\n{entry_text}\n"

                  path = Path("CHANGELOG.md")
                  content = path.read_text()
                  lines = content.split("\n")
                  for i, line in enumerate(lines):
                      if line.startswith("# "):
                          lines.insert(i + 1, entry)
                          break
                  new_content = "\n".join(lines)
                  # entry's own leading/trailing newlines plus the file's existing
                  # blank-line separators otherwise stack into a double blank line
                  # right before the previously-latest entry, which mdformat then
                  # wants to collapse on the next `pre-commit run --all-files`.
                  new_content = re.sub(r"\n{3,}", "\n\n", new_content)
                  path.write_text(new_content)
                  PYEOF

            - name: Push version bump branch, tag, and open PR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CHANGELOG_ENTRY: ${{ needs.analyze-changes.outputs.changelog }}
                  PACKAGE_NAME: ${{ inputs.package_name }}
                  DOCS_URL: ${{ inputs.docs_url }}
                  PYPI_BASE_URL: ${{ inputs.pypi_base_url }}
                  VERSION_BUMP: ${{ needs.analyze-changes.outputs.version_bump }}
                  BOLSTER_TOKEN: ${{ secrets.BOLSTER_TOKEN }}
              run: |
                  BRANCH="release/v${NEW_VERSION}"

                  # PRs opened with GITHUB_TOKEN never fire pull_request_target (GitHub
                  # suppresses it to prevent loops), so automerge.yml — which is built to
                  # approve+merge exactly this kind of bot PR — can never see them; every
                  # release PR to date has needed a manual merge regardless of bump size.
                  # Patch and minor bumps are already unattended in every other respect
                  # (auto-detected, past the block_major gate), so enable auto-merge
                  # directly here with a token that isn't GITHUB_TOKEN, instead of
                  # relying on a trigger that can't fire. Major only reaches this step
                  # via an explicit human workflow_dispatch, so it's left for manual
                  # review and merge — a deliberate decision shouldn't auto-merge itself.
                  enable_automerge() {
                    if [ "$VERSION_BUMP" = "patch" ] || [ "$VERSION_BUMP" = "minor" ]; then
                      echo "$VERSION_BUMP release — enabling auto-merge for $1"
                      GH_TOKEN="$BOLSTER_TOKEN" gh pr merge --auto --squash "$1"
                    fi
                  }

                  # Idempotency: the tag itself is immutable once pushed (it may
                  # already be published), but the *branch* is not treated as a
                  # source of truth — a previous run's branch can go stale (its PR
                  # sat unmerged long enough to conflict with everything else that
                  # landed on main since; confirmed live, this happened to v0.7.7).
                  # So: always build the bump commit fresh from current HEAD
                  # (already checked out at the top of this job) and force-push it,
                  # regardless of what a prior attempt left behind. The only thing
                  # gated on the tag already existing is re-tagging itself.
                  TAG_EXISTS=false
                  if git ls-remote --exit-code origin "refs/tags/v${NEW_VERSION}" 2>/dev/null; then
                    echo "Tag v${NEW_VERSION} already exists — will refresh the version-bump branch/PR without re-tagging"
                    TAG_EXISTS=true
                  fi

                  git checkout -b "$BRANCH"
                  git add .
                  git commit -m "chore: bump version to ${NEW_VERSION}"
                  if [ "$TAG_EXISTS" = false ]; then
                    git tag "v${NEW_VERSION}"
                  fi
                  git push --force origin "$BRANCH"
                  if [ "$TAG_EXISTS" = false ]; then
                    git push origin "v${NEW_VERSION}"
                  fi

                  EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' 2>/dev/null || true)
                  if [ -n "$EXISTING_PR" ]; then
                    echo "PR #${EXISTING_PR} already open — branch refreshed, nothing else to do"
                    enable_automerge "$EXISTING_PR"
                    exit 0
                  fi

                  # Build optional PR body sections
                  INSTALL_SECTION=""
                  if [ -n "$PACKAGE_NAME" ]; then
                    INSTALL_SECTION="## Installation\n\n\`\`\`bash\npip install ${PACKAGE_NAME}==${NEW_VERSION}\n\`\`\`\n\n"
                  fi
                  DOCS_SECTION=""
                  if [ -n "$DOCS_URL" ] || [ -n "$PYPI_BASE_URL" ]; then
                    DOCS_SECTION="## Documentation\n\n"
                    [ -n "$DOCS_URL" ]      && DOCS_SECTION="${DOCS_SECTION}- [Documentation](${DOCS_URL})\n"
                    [ -n "$PYPI_BASE_URL" ] && DOCS_SECTION="${DOCS_SECTION}- [PyPI Package](${PYPI_BASE_URL}/${NEW_VERSION}/)\n"
                    DOCS_SECTION="${DOCS_SECTION}\n"
                  fi
                  RETRY_NOTE=""
                  if [ "$TAG_EXISTS" = true ]; then
                    RETRY_NOTE="_Retry: tag v${NEW_VERSION} was already pushed (and likely already published) in a previous run; this PR only catches main's version file up to it._\n\n"
                  fi

                  printf "Automated version bump to %s.\n\n%s## Changes in this release\n\n%s\n\n%s%s---\n*This PR was automatically created by the release workflow.*\n" \
                    "${NEW_VERSION}" "${RETRY_NOTE}" "${CHANGELOG_ENTRY}" "${INSTALL_SECTION}" "${DOCS_SECTION}" \
                    > /tmp/pr-body.md

                  GH_TOKEN="$BOLSTER_TOKEN" gh pr create \
                    --title "chore: bump version to ${NEW_VERSION}" \
                    --body-file /tmp/pr-body.md \
                    --label "version:skip" \
                    --base main \
                    --head "$BRANCH"
                  enable_automerge "$BRANCH"
