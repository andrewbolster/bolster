name: Lint With Ruff

permissions: read-all

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
          - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
            with:
              python-version: "3.11"
          # Runs the exact hook config in .pre-commit-config.yaml — CI and
          # local pre-commit cannot disagree about what counts as clean,
          # since there's only one place (that file) where versions live.
          - name: Install dependencies
            run: uv sync --group dev
          - name: Run pre-commit
            run: uv run pre-commit run --all-files --show-diff-on-failure

    security:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
          - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
            with:
              python-version: "3.11"
          - name: Install bandit
            run: uv tool install bandit
          - name: Run bandit security scan
            run: bandit -r src/bolster -ll -x src/bolster/cli.py

    ty:
        runs-on: ubuntu-latest
        # Its own job rather than a pre-commit hook: a real, visible,
        # independently-failing merge status check. ty is pinned exactly in
        # pyproject.toml because its diagnostics change between 0.0.x releases.
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
          - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
            with:
              python-version: "3.11"
          - name: Install dependencies
            run: uv sync --group dev
          - name: Run ty
            run: uv run ty check src/bolster
