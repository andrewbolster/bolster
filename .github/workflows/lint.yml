name: Lint With Ruff

permissions: read-all

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
          - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
            with:
              python-version: "3.11"
          # Runs the exact hook config in .pre-commit-config.yaml — CI and
          # local pre-commit cannot disagree about what counts as clean,
          # since there's only one place (that file) where versions live.
          - name: Install dependencies
            run: uv sync --group dev
          - name: Run pre-commit
            run: uv run pre-commit run --all-files --show-diff-on-failure

    security:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
          - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
            with:
              python-version: "3.11"
          - name: Install bandit
            run: uv tool install bandit
          - name: Run bandit security scan
            run: bandit -r src/bolster -ll -x src/bolster/cli.py

    mypy:
        runs-on: ubuntu-latest
        # Not a pre-commit hook: 341 pre-existing errors across 50 files on
        # first run would block every local commit. A separate job here
        # instead — a real, visible, independently-failing merge status
        # check without gating commits on a debt this change didn't create.
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
          - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
            with:
              python-version: "3.11"
          - name: Install dependencies
            run: uv sync --group dev
          - name: Run mypy
            run: uv run mypy src/bolster --ignore-missing-imports
