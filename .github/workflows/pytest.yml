name: PyTest

permissions: read-all

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

# Concurrency design (keep this comment before changing the block):
# Per-ref + cancel-in-progress was chosen over a single global queue after
# 7 PRs toggled between the two strategies in ~2 weeks (PRs #1938–#1950).
#
# The alternative tried then (group: pytest-all, cancel-in-progress: false)
# serialised ALL runs to avoid concurrent load on upstream NISRA/NI Assembly
# APIs, but was dropped because a single shared group across all refs breaks
# under rebase-style traffic: a fresh push to the SAME ref makes that ref's
# own already-queued entry in the group look like a brand-new low-priority
# entrant and cancels it on the spot. Once rebase.yml started pushing every
# open PR forward on every merge to main, a run could wait ~29 minutes and
# still get wiped before a single job ran — twice in a row. That starvation,
# not the serialisation goal itself, is what killed the global queue.
#
# The two-tier structure below (queue -> build) restores cross-ref
# serialisation without reintroducing that failure mode: `queue` is a
# near-instant job holding the one shared, global group, so a branch that
# gets re-pushed while waiting only loses a few seconds of position, not a
# run's full ~20 minutes. `build` keeps its own concurrency group scoped
# per-ref *and* per-matrix-cell, so same-ref reruns still cancel each other
# immediately and the matrix still runs (with max-parallel: 1, in sequence)
# same as before. Prototyped and verified first in
# andrewbolster/mcp.bolster.online#23 (same problem, ~2min matrix instead of
# ~20min, so a bad iteration was cheap to observe there).
#
# If starvation reappears under real traffic, or the download cache/
# rerun-timed-out.yml stop being enough on their own, revisit before
# reaching for anything blunter than this.
jobs:
    queue:
        name: Queue gate
        runs-on: ubuntu-latest
        concurrency:
            group: bolster-pytest-queue
            cancel-in-progress: false
        steps:
            - run: echo "cleared to run for ${{ github.sha }} on ${{ github.ref }}"

    build:
        needs: queue
        runs-on: ubuntu-latest
        # Matrix cell included so a future increase in max-parallel still
        # only cancels same-ref-same-cell reruns, not the whole matrix.
        concurrency:
            group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}-${{ matrix.python-version }}
            cancel-in-progress: true
        strategy:
            max-parallel: 1
            matrix:
                python-version: ["3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  fetch-depth: 0
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install uv and set the python version
              uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Get current date
              id: date
              run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

            - name: Cache downloaded source data
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
              with:
                  path: ~/.cache/bolster
                  # Key rotates daily so a successful download survives between
                  # runs on the same day (shared across the whole matrix via
                  # restore-keys) without caching stale/broken downloads forever.
                  key: bolster-downloads-${{ runner.os }}-${{ steps.date.outputs.date }}
                  restore-keys: |
                      bolster-downloads-${{ runner.os }}-

            - name: Install the project
              run: uv sync --all-extras --dev

            - name: Run tests
              # For example, using `pytest`
              run: uv run pytest tests --cov-branch --cov-report=xml --cov=bolster --cov --junitxml=junit.xml -o junit_family=legacy

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
              with:
                  report_type: test_results
                  token: ${{ secrets.CODECOV_TOKEN }}

    # Docstring examples are executable documentation: they hit the same live
    # sources as the test suite, so they rot silently when a publisher changes a
    # column or a URL. Run once on a single Python version rather than folding
    # `src` into the matrix above — the examples are version-independent, and
    # repeating them three times would triple the load on upstream publishers.
    #
    # needs: build — not for ordering's own sake (doctests isn't a required
    # status check, so it never gates auto-merge), but running after rather
    # than alongside the matrix means the two aren't hitting the same upstream
    # APIs at the same time, which is the actual rate-limit risk.
    doctests:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            - name: Install uv
              uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
              with:
                  python-version: "3.13"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Get current date
              id: date
              run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

            - name: Cache downloaded source data
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
              with:
                  path: ~/.cache/bolster
                  key: bolster-downloads-${{ runner.os }}-${{ steps.date.outputs.date }}
                  restore-keys: |
                      bolster-downloads-${{ runner.os }}-

            - name: Install the project
              run: uv sync --all-extras --dev

            - name: Run doctests
              run: uv run pytest src --doctest-modules --no-cov
