# Publishes every release, automatic or manual: release-logic.yml pushes a
# `v*.*.*` tag on every patch/minor auto-release (and on a manually
# dispatched major one), which triggers this on the `push: tags` path below.
# `workflow_dispatch` is the escape hatch for a manual/emergency re-publish
# of a tag that already exists, not the normal path.
name: Manual Publish to PyPI

permissions: read-all

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: 'Git tag to publish (e.g., v1.2.3)'
                required: true
                type: string

env:
    python-version: 3.11

jobs:
    publish:
        name: Publish to PyPI
        runs-on: ubuntu-latest
        environment: release
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Verify tag format
              run: |
                if [[ "${{ github.event.inputs.tag || github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "Valid version tag format"
                else
                  echo "Invalid version tag format. Expected: v1.2.3"
                  exit 1
                fi

            - name: Install uv and set the python version
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
              with:
                python-version: ${{ env.python-version }}
                enable-cache: true
                cache-dependency-glob: "uv.lock"

            - name: Install the project
              run: uv sync --all-extras

            - name: Run tests before publishing
              run: uv run pytest tests/ -v

            - name: Build package
              run: uv build

            - name: Verify package contents
              run: |
                uv run twine check dist/*
                uv run python -m zipfile -l dist/*.whl

            - name: Publish to PyPI with attestations
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
              with:
                attestations: true
                print-hash: true

            - name: Create GitHub Release
              # No `if:` gate — this used to only run on workflow_dispatch,
              # which meant every automatic release (every patch/minor bump
              # since v0.7.1) published to PyPI but never got a GitHub
              # Release object, and anything listening for the `release`
              # event (e.g. andrewbolster/mcp.bolster.online's
              # repository_dispatch notifier) never fired.
              uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d  # v3
              with:
                tag_name: ${{ github.event.inputs.tag || github.ref_name }}
                name: Release ${{ github.event.inputs.tag || github.ref_name }}
                body: |
                  Release ${{ github.event.inputs.tag || github.ref_name }}.

                  ## Installation

                  ```bash
                  pip install bolster==${{ github.event.inputs.tag || github.ref_name }}
                  ```
                draft: false
                prerelease: false
                files: dist/*
